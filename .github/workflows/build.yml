name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project (and downgrade format for Xcode 15)
      run: |
        xcodegen generate
        echo "--- before fix ---"
        grep -m1 "objectVersion" CatVodPlayer.xcodeproj/project.pbxproj
        sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 56/g' CatVodPlayer.xcodeproj/project.pbxproj
        echo "--- after fix ---"
        grep -m1 "objectVersion" CatVodPlayer.xcodeproj/project.pbxproj

    - name: Build App
      run: |
        xcodebuild -project CatVodPlayer.xcodeproj \
                   -scheme CatVodPlayer \
                   -configuration Release \
                   -destination 'generic/platform=iOS' \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   DEVELOPMENT_TEAM="" \
                   build 2>&1 | tee /tmp/build.log

    - name: Create IPA
      if: success()
      run: |
        APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -path "*CatVodPlayer*" | head -1)
        echo "APP=$APP"
        if [ -z "$APP" ]; then
          echo "App not found"; ls ~/Library/Developer/Xcode/DerivedData/; exit 1
        fi
        mkdir -p build/Payload
        cp -r "$APP" build/Payload/
        cd build && zip -r CatVodPlayer.ipa Payload

    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CatVodPlayer-IPA
        path: build/CatVodPlayer.ipa
