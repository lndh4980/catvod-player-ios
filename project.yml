name: CatVodPlayer
options:
  bundleIdPrefix: com.catvod.player
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: "影视仓"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  CatVodPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.catvod.player
        CODE_SIGN_ENTITLEMENTS: Sources/CatVodPlayer.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CatVodPlayer-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/Frameworks"]
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    dependencies:
      - framework: Frameworks/MobileVLCKit.framework
        embed: true
